  /api/v1/orgs/{orgId}/preflight:
    post:
      summary: Pre-flight go / no-go from records on file (advisory)
      tags:
        - flights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pilotId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                aircraftId:
