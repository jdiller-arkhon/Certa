  /api/v1/public/share/{token}:
    get:
      summary: Inspector packet behind a share link (no account needed)
      tags:
        - share
      parameters:
        - schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{43}$
          in: path
          name: token
          required: true
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  label:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                  seal:
                    type: string
                    pattern: ^[a-f0-9]{64}$
                  packet:
                    type: object
                    properties:
                      version:
                        type: number
                        enum:
                          - 1
                      organization:
                        type: string
                      generatedAt:
                        type: string
                      asOf:
                        type: string
                      ruleSet:
                        type: string
                      subject:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                              - pilot
                              - aircraft
                          name:
                            type: string
                          facts:
                            type: array
                            items:
                              type: array
                              prefixItems:
                                - type: string
                                - type: string
                              items: false
                              minItems: 2
                              maxItems: 2
                        required:
                          - type
                          - name
                          - facts
                        additionalProperties: false
                      status:
                        type: object
                        properties:
                          level:
                            type: string
                            enum:
                              - green
                              - amber
                              - red
                          label:
                            type: string
                        required:
                          - level
                          - label
                        additionalProperties: false
                      records:
                        type: array
                        items:
                          type: object
                          properties:
                            label:
                              type: string
                            level:
                              type: string
                              enum:
                                - green
                                - amber
                                - red
                            status:
                              type: string
                            due:
                              type:
                                - string
                                - "null"
                            detail:
                              type: string
                          required:
                            - label
                            - level
                            - status
                            - due
                            - detail
                          additionalProperties: false
                      activity:
                        type: object
                        properties:
                          flights:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          flightTime:
                            type: string
                          last90Flights:
                            type: integer
                            minimum: -9007199254740991
                            maximum: 9007199254740991
                          last90FlightTime:
                            type: string
                        required:
                          - flights
                          - flightTime
                          - last90Flights
                          - last90FlightTime
                        additionalProperties: false
                      recentFlights:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            duration:
                              type: string
                            with:
                              type: string
                            location:
                              type:
                                - string
                                - "null"
                          required:
                            - date
                            - duration
                            - with
                            - location
                          additionalProperties: false
                      disclaimer:
                        type: string
                    required:
                      - version
                      - organization
                      - generatedAt
                      - asOf
                      - ruleSet
                      - subject
                      - status
                      - records
                      - activity
                      - recentFlights
                      - disclaimer
                    additionalProperties: false
                required:
                  - label
                  - expiresAt
                  - seal
                  - packet
                additionalProperties: false
