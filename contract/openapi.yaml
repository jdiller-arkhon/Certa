                  type: string
                  minLength: 1
                  maxLength: 100
                reference:
                  anyOf:
                    - type: string
                      maxLength: 200
                    - type: "null"
                takeoffAt:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                landingAt:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                locationName:
                  anyOf:
                    - type: string
                      maxLength: 300
                    - type: "null"
                lat:
                  anyOf:
                    - type: number
                      minimum: -90
                      maximum: 90
                    - type: "null"
                lng:
                  anyOf:
                    - type: number
                      minimum: -180
                      maximum: 180
                    - type: "null"
              required:
                - pilot
                - jobId
                - takeoffAt
                - landingAt
