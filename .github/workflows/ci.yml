name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_PG_SERVER_URL: postgres://postgres:postgres@localhost:5432
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Typecheck, unit + integration tests, contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" --filter @certa/api build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Contract, SDK, fixtures, and RULES_VERIFICATION.md are up to date
        run: pnpm contract:check

  e2e:
    name: Web end-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" --filter @certa/api build
      - run: pnpm --filter @certa/web exec playwright install --with-deps chromium
      - run: pnpm --filter @certa/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: apps/web/test-results }

  docker:
    name: Build self-hosted images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infra/docker/Dockerfile --target api -t certa-api:ci .
      - run: docker build -f infra/docker/Dockerfile --target web -t certa-web:ci .
